map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream docker_platform_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Aggressive body size so project archive uploads can pass through.
    client_max_body_size 100m;

    # Light proxy defaults.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # --- nginx-level liveness (does not hit the API) ---
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- WebSocket passthrough (job events, container metrics) ---
    location /ws/ {
        proxy_pass http://docker_platform_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # --- Backend HTTP API + auth + observability ---
    location /api/ {
        proxy_pass http://docker_platform_api;
    }
    location /auth/ {
        proxy_pass http://docker_platform_api;
    }
    location = /health {
        proxy_pass http://docker_platform_api;
    }
    location = /metrics {
        proxy_pass http://docker_platform_api;
    }
    location = /openapi.json {
        proxy_pass http://docker_platform_api;
    }
    location /docs {
        proxy_pass http://docker_platform_api;
    }
    location /redoc {
        proxy_pass http://docker_platform_api;
    }

    # --- Static SPA assets with long cache ---
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback (client-side routing) ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
