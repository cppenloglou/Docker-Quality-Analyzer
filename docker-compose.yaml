services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty => the SPA calls the same origin. nginx in this container
        # proxies /api, /auth, /health, /metrics, /ws to the api service.
        VITE_API_BASE_URL: ""
    container_name: docker-platform-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docker-platform-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/docker_platform
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=change-me-in-production
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/storage/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docker-platform-worker
    command: ["arq", "app.workers.worker.WorkerSettings"]
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/docker_platform
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=change-me-in-production
      - DOCKER_HOST=tcp://dind:2375
      - DOCKER_TLS_VERIFY=
      - DOCKER_CERT_PATH=
    depends_on:
      dind:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/storage/uploads
    restart: unless-stopped

  dind:
    image: docker:27-dind
    container_name: docker-platform-dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["--host=tcp://0.0.0.0:2375", "--storage-driver=overlay2"]
    volumes:
      - dind_data:/var/lib/docker
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docker-platform-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: docker-platform-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=docker_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docker_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  dind_data:
