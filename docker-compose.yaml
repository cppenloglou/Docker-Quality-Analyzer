services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docker-platform-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/docker_platform
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=change-me-in-production
    depends_on:
      - redis
      - postgres
    volumes:
      - uploads_data:/app/storage/uploads

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "app.workers.worker.WorkerSettings"]
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/docker_platform
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=change-me-in-production
    depends_on:
      - redis
      - postgres
    volumes:
      - uploads_data:/app/storage/uploads

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=docker_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads_data: