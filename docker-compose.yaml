name: docker-platform

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docker-platform-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/storage/uploads
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/docker_platform
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  dind:
    image: docker:27-dind
    container_name: docker-platform-dind
    volumes:
      - dind_data:/var/lib/docker
    environment:
      - DOCKER_TLS_CERTDIR=
    command: ["--host=tcp://0.0.0.0:2375", "--storage-driver=overlay2"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    privileged: true # Required for Docker-in-Docker; keep isolated to internal network only.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty => the SPA calls the same origin. nginx in this container
        # proxies /api, /auth, /health, /metrics, /ws to the api service.
        VITE_API_BASE_URL: ""
    container_name: docker-platform-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: docker-platform-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=docker_platform
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docker_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: docker-platform-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docker-platform-worker
    depends_on:
      dind:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/storage/uploads
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/docker_platform
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      - DOCKER_HOST=tcp://dind:2375
      - DOCKER_TLS_VERIFY=
      - DOCKER_CERT_PATH=
    command: ["arq", "app.workers.worker.WorkerSettings"]
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  dind_data:
