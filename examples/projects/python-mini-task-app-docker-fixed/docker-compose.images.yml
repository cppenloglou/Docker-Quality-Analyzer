# Image-only compose file. It does NOT build anything.
# Build the images first, then run this file:
#   docker build -t local/python-mini-task-app:prod -f Dockerfile .
#   docker build -t local/python-mini-task-app:smoke -f Dockerfile.smoke .
#   docker compose -f docker-compose.images.yml up
services:
  web:
    image: local/python-mini-task-app:prod
    ports:
      - "5000:5000"
    environment:
      APP_ENV: production
      DATABASE_PATH: /data/tasks.db
    volumes:
      - task-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  smoke:
    image: local/python-mini-task-app:smoke
    environment:
      TARGET_URL: http://web:5000
    depends_on:
      web:
        condition: service_healthy
    profiles: ["test"]

volumes:
  task-data:
