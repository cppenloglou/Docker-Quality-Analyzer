# Build-based production-like compose file using the production Dockerfile.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/python-mini-task-app:prod
    ports:
      - "5000:5000"
    environment:
      APP_ENV: production
      DATABASE_PATH: /data/tasks.db
    volumes:
      - task-data:/data
    restart: unless-stopped

volumes:
  task-data:
