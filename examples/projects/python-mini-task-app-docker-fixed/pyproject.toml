[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-mini-task-app"
version = "0.1.0"
description = "Small Flask task app used to demonstrate Dockerfiles and Docker Compose."
requires-python = ">=3.12"
dependencies = [
  "flask==3.0.3",
  "gunicorn==23.0.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
