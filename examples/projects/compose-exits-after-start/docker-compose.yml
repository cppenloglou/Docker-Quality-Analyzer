services:
  app:
    image: busybox:1.36.1
    command:
      - sh
      - -c
      - |
        echo "[app] started";
        sleep 15;
        echo "[app] fatal: simulated crash after startup" >&2;
        exit 1

  worker:
    image: busybox:1.36.1
    command:
      - sh
      - -c
      - |
        echo "[worker] started";
        sleep 22;
        echo "[worker] fatal: simulated crash after startup" >&2;
        exit 1
