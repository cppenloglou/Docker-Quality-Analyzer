services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: node:20-alpine
    working_dir: /usr/src/app
    command: ["node", "server.js"]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  cache:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
